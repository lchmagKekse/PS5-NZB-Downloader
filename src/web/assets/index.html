<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 NZB Downloader</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/pico.min.css">
<link rel="stylesheet" href="/fontawesome.min.css">
<link rel="stylesheet" href="/main.css">
</head>
<body>
<header class="site-header">
  <nav class="container-fluid">
    <ul><li class="brand"><strong><img src="/favicon.svg" alt="" class="brand-icon"> PS5 NZB Downloader</strong><span class="version-tag">v0.2.1</span></li></ul>
    <ul>
      <li><a href="/settings.html" class="icon-link" title="Settings" aria-label="Settings"><i class="fa-solid fa-gear fa-lg"></i></a></li>
    </ul>
  </nav>
</header>

<main class="container-fluid">
  <article>
    <div class="stats-grid" id="stats">
      <div class="stat stat-queue"><div class="label"><i class="fa-solid fa-layer-group"></i> Queue</div><div class="value" id="stat-queue">-</div></div>
      <div class="stat"><div class="label"><i class="fa-solid fa-gauge-high"></i> Speed</div><div class="value" id="stat-speed">-</div></div>
      <div class="stat stat-conns"><div class="label"><i class="fa-solid fa-ethernet"></i> Connections</div><div class="value" id="stat-conns">-</div></div>
      <label class="dropzone stat" id="dropzone" for="nzb-files">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <div>Drag &amp; drop .nzb files here, or click to browse</div>
        <input type="file" id="nzb-files" name="nzb" accept=".nzb,application/x-nzb,text/xml" multiple>
      </label>
    </div>
  </article>

  <article class="jobs-panel">
    <figure class="table-scroll">
      <table class="jobs-table">
        <thead>
          <tr><th>Name</th><th>State</th><th>Progress</th><th>Size</th><th></th></tr>
        </thead>
        <tbody id="job-rows">
          <tr><td colspan="5" class="muted">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </figure>
  </article>
</main>

<dialog id="confirm-modal">
  <article>
    <header>
      <strong id="confirm-modal-title">Confirm</strong>
    </header>
    <p id="confirm-modal-message"></p>
    <footer>
      <button type="button" class="secondary" data-modal-cancel>Cancel</button>
      <button type="button" id="confirm-modal-confirm">Confirm</button>
    </footer>
  </article>
</dialog>

<dialog id="rename-modal">
  <article>
    <header>
      <strong>Add this download</strong>
    </header>
    <label for="rename-input">Name</label>
    <input type="text" id="rename-input">
    <small class="muted">Used as the job name and the output folder name.</small>

    <label for="rename-output-dir">Output folder</label>
    <input type="text" id="rename-output-dir">
    <small class="muted">Final destination once the download completes.</small>

    <label class="shadowmount-row" for="rename-shadowmount">
      <input type="checkbox" id="rename-shadowmount">
      Add path to ShadowMountPlus
    </label>

    <label class="shadowmount-row" for="rename-auto-install-pkgs">
      <input type="checkbox" id="rename-auto-install-pkgs">
      Install PKGs after extraction
    </label>

    <footer>
      <button type="button" class="secondary" data-modal-cancel>Cancel</button>
      <button type="button" id="rename-modal-confirm">Add</button>
    </footer>
  </article>
</dialog>

<dialog id="install-pkgs-modal">
  <article>
    <header>
      <strong>Install PKGs</strong>
    </header>
    <div id="install-pkgs-modal-list" class="pkg-install-list"></div>
    <footer>
      <button type="button" class="secondary" data-modal-cancel>Cancel</button>
      <button type="button" id="install-pkgs-modal-confirm">Install</button>
    </footer>
  </article>
</dialog>

<dialog id="nfo-modal">
  <article>
    <header>
      <strong id="nfo-modal-title">NFO</strong>
    </header>
    <pre id="nfo-modal-content" class="nfo-viewer"></pre>
    <footer>
      <button type="button" class="secondary" data-modal-cancel>Close</button>
    </footer>
  </article>
</dialog>

<script src="/main.js"></script>
<script>
  
const PENDING_STATES = ['queued', 'downloading', 'paused', 'verifying', 'repairing', 'extracting'];
const JOB_DISPLAY_STATE_RANK = {
  verifying: 0, repairing: 0, extracting: 0,
  downloading: 1,
  queued: 2,
  paused: 3,
  failed: 4, cancelled: 4,
  completed: 5,
};
function sortJobsForDisplay(jobs) {
  return jobs.sort((a, b) =>
    (JOB_DISPLAY_STATE_RANK[a.state] ?? 99) - (JOB_DISPLAY_STATE_RANK[b.state] ?? 99));
}

function jobRowCells(j) {
  return `
    <td data-label="Name"><a href="/job.html?id=${encodeURIComponent(j.id)}">${escapeHtml(j.name)}</a></td>
    <td data-label="State">${stateBadge(j.state)}</td>
    <td data-label="Progress">${progressBarHtml(j)}</td>
    <td data-label="Size">${formatBytes(j.progress.total_bytes)}</td>
    <td data-label="Actions">${jobActionButtons(j)}</td>`;
}

function renderJobRows(jobs) {
  const rows = document.getElementById('job-rows');
  const sorted = sortJobsForDisplay(jobs);

  if (!sorted.length) {
    rows.innerHTML = '<tr><td colspan="5" class="muted">Queue is empty</td></tr>';
    return;
  }

  Array.from(rows.children).forEach(tr => { if (!tr.dataset.jobId) tr.remove(); });

  const existing = new Map();
  rows.querySelectorAll('tr[data-job-id]').forEach(tr => existing.set(tr.dataset.jobId, tr));

  let prev = null;
  for (const j of sorted) {
    let tr = existing.get(j.id);
    if (tr) {
      existing.delete(j.id);
      if (tr.dataset.state !== j.state) {
        tr.innerHTML = jobRowCells(j);
        tr.dataset.state = j.state;
      } else {
        tr.children[2].innerHTML = progressBarHtml(j);
        tr.children[3].textContent = formatBytes(j.progress.total_bytes);
      }
    } else {
      tr = document.createElement('tr');
      tr.dataset.jobId = j.id;
      tr.dataset.state = j.state;
      tr.innerHTML = jobRowCells(j);
    }

    const ref = prev ? prev.nextSibling : rows.firstChild;
    if (ref !== tr) rows.insertBefore(tr, ref);
    prev = tr;
  }

  existing.forEach(tr => tr.remove());
}

async function refresh() {
  try {
    const status = await apiGet('/api/status');

    document.getElementById('stat-speed').textContent = formatSpeed(status.download_speed_bytes_per_sec);
    document.getElementById('stat-conns').textContent = status.active_connections + ' / ' + status.max_connections;

    const jobs = await apiGet('/api/jobs');
    document.getElementById('stat-queue').textContent = jobs.filter(j => PENDING_STATES.includes(j.state)).length;

    renderJobRows(jobs);
  } catch (e) {
    console.error(e);
  }
}

window.refreshNow = refresh;

/* One file at a time (the upload endpoint takes a single NZB per POST,
 * see api_jobs_create()) -- each valid .nzb gets its own rename-on-add
 * modal before uploading, so drop order stays predictable rather than a
 * pile of modals queuing up at once. */
async function queueFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;

  /* Fetched once per drop/browse batch, not once per file -- the "Output
   * folder" field's autofill should reflect whatever is currently
   * configured in Settings at the moment the user is adding these NZBs,
   * not stale per-file. */
  let defaultOutputDir = '';
  try {
    const cfg = await apiGet('/api/config');
    defaultOutputDir = (cfg.storage && cfg.storage.output_dir) || '';
  } catch (e) {
    console.error(e);
  }

  for (const file of files) {
    if (!/\.nzb$/i.test(file.name)) {
      alert(file.name + ': Not a .nzb file');
      continue;
    }

    const choice = await renamePrompt(suggestJobName(file.name), defaultOutputDir);
    if (choice === null) continue;

    try {
      const fd = new FormData();
      fd.append('nzb', file, file.name);
      fd.append('display_name', choice.name);
      fd.append('output_dir', choice.outputDir);
      fd.append('add_to_shadowmount', choice.shadowmount ? '1' : '0');
      fd.append('auto_install_pkgs', choice.autoInstallPkgs ? '1' : '0');
      const r = await fetch('/api/jobs', { method: 'POST', body: fd });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
    } catch (err) {
      alert(file.name + ': ' + err.message);
    }
  }

  refresh();
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('nzb-files');

fileInput.addEventListener('change', () => {
  queueFiles(fileInput.files);
  fileInput.value = '';
});

['dragenter', 'dragover'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave', 'dragend'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer && e.dataTransfer.files.length) queueFiles(e.dataTransfer.files);
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
